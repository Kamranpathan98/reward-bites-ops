# Flyway CLI configuration (committed, no secrets).
#
# Naming convention: V<yyyyMMddHHmm>__<snake_description>.sql for versioned
# migrations, R__<snake_description>.sql for repeatables (idempotent,
# DROP ... IF EXISTS then CREATE/re-derive).
#
# Connection (url/user/password) is intentionally NOT set here — supply it
# via the FLYWAY_URL / FLYWAY_USER / FLYWAY_PASSWORD environment variables,
# which the Flyway CLI reads automatically. See docs/DEVELOPMENT.md.
flyway.locations=filesystem:db/migrations
flyway.sqlMigrationPrefix=V
flyway.repeatableSqlMigrationPrefix=R
flyway.baselineOnMigrate=false
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
